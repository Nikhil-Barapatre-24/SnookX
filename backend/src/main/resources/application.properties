spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poolsync}
spring.datasource.username=${DB_USERNAME:poolsync}
spring.datasource.password=${DB_PASSWORD:poolsync}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true

app.jwt.issuer=${JWT_ISSUER:poolsync-backend}
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-32-bytes-minimum}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
